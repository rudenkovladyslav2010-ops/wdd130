<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="This page allows user to give their contact information and reach out to the White Water Rafting company with any questions they have.">
    <meta name="author" content="Vladyslav Rudenko">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/white-water-rafting-logo.jpg" alt="White Water Rafting logo">
        <nav>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>

        </nav>
    </header>
    <main>
        <div class="company-name">
            <h1>Contact Us - White Water Rafting</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 123 456 7890</p>
            <p>info@whitewater.com</p>

        </div>
        <div class="contact-content">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3968.5833182833053!2d-120.88323165395414!3d38.79365426903765!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x809afdb1665b13cf%3A0x5c0c8908e5ceb092!2z0KDQtdC60LAg0K7QsyDQpNC-0YDQuiDQkNC80LXRgNC40LrQsNC9!5e0!3m2!1sru!2sus!4v1791067707248!5m2!1sru!2sus"
                width="450" height="400" allowfullscreen="" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="e.g. John Smith">

                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="e.g. me@gmail.com">

                <label>Message<br>Purpose</label>
                <div class="message-purpose">
                    <label>
                        <input type="radio" id="general" name="purpose">
                        General Inquiry
                    </label>
                    <label>
                        <input type="radio" id="reservation" name="purpose">
                        Reservation Question
                    </label>
                    <label>
                        <input type="radio" id="suggestion" name="purpose">
                        Website Suggestion
                    </label>
                </div>

                <div class="message">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"></textarea>
                </div>

                <div class="subscribe">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                </div>


                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/river-guide.jpg" alt="River guide">
                <figcaption>River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/reservations-manager.jpg" alt="Reservations manager">
                <figcaption>Reservations Manager</figcaption>
            </figure>
            <figure>
                <img src="images/customer-service.jpg" alt="Customer service">
                <figcaption>Customer Service</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>©2026 | White Water Rafting | Vladyslav Rudenko</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-logo.png" alt="Facebook logo">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-logo.png" alt="Instagram logo">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-logo.png" alt="Linkedin logo">
            </a>
        </nav>
    </footer>
</body>

</html>
